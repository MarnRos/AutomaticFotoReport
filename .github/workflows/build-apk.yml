name: Compila APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compila APK
        shell: bash
        run: |
          set -o pipefail
          if ! gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log; then
            # riporta gli errori come annotazioni leggibili
            grep -E "^e: |error:|What went wrong|Could not|> " build.log | head -40 | while IFS= read -r l; do
              echo "::error::${l//%/%25}"
            done
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: AutomaticFotoReport-apk
          path: app/build/outputs/apk/debug/*.apk
