name: Compila APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compila APK
        shell: bash
        run: |
          set -o pipefail
          if ! gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log; then
            # riporta gli errori come annotazioni leggibili
            grep -E "^e: |error:|What went wrong|Could not|> " build.log | head -40 | while IFS= read -r l; do
              echo "::error::${l//%/%25}"
            done
            exit 1
          fi

      - name: Rinomina APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AutomaticFotoReport.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AutomaticFotoReport-apk
          path: AutomaticFotoReport.apk

      - name: Pubblica nella pagina Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-versione
          name: Automatic Foto Report (ultima versione)
          body: APK compilato automaticamente dall'ultimo aggiornamento. Scarica AutomaticFotoReport.apk e installalo sul telefono.
          files: AutomaticFotoReport.apk
          make_latest: true
